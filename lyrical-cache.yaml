name: lyrical
type: cache
version: 2
distribution_file:
  type: distribution
  version: 3
  release_platforms:
    ubuntu: [resolute]
  extends:
    - distro_name: jetty
      extension_method: source_rebuild
  repositories:
    common_interfaces:
      release:
        packages: [std_msgs]
        tags: {release: 'release/rolling/{package}/{version}'}
        url: https://github.com/ros2-gbp/common_interfaces-release.git
        version: 5.9.2-2
      status: maintained
    ros_tutorials:
      release:
        packages: [turtlesim]
        tags: {release: 'release/rolling/{package}/{version}'}
        url: https://github.com/ros2-gbp/ros_tutorials-release.git
        version: 1.9.2-1
      status: maintained
    ros_gz:
      release:
        packages:
          - ros_gz
          - ros_gz_bridge
          - ros_gz_image
          - ros_gz_interfaces
          - ros_gz_sim
          - ros_gz_sim_demos
        tags: {release: 'release/lyrical/{package}/{version}'}
        url: https://github.com/ros2-gbp/ros_ign-release.git
        version: 3.0.9-1
      status: maintained
release_package_xmls:
  std_msgs: '<package format="3"><name>std_msgs</name><version>5.9.2</version><description>Standard ROS Messages</description><maintainer email="test@test.com">Test</maintainer><license>Apache-2.0</license></package>'
  turtlesim: '<package format="3"><name>turtlesim</name><version>1.9.2</version><description>Turtlesim</description><maintainer email="test@test.com">Test</maintainer><license>BSD</license></package>'
  ros_gz_sim: '<package format="3"><name>ros_gz_sim</name><version>3.0.9</version><description>ROS Gazebo Sim</description><maintainer email="test@test.com">Test</maintainer><license>Apache-2.0</license></package>'
  ros_gz_bridge: '<package format="3"><name>ros_gz_bridge</name><version>3.0.9</version><description>ROS Gazebo Bridge</description><maintainer email="test@test.com">Test</maintainer><license>Apache-2.0</license></package>'
source_repo_package_xmls: {}
